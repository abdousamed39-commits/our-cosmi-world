<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi WORLD V3 PUB - Alibaba</title>
<style>
:root{--orange:#FF6A00;--rose:#ff2e78;--bg:#f5f5f5}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Poppins,sans-serif}
body{background:var(--bg)}
.topbar{background:var(--orange);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px;font-weight:700}
.header{position:sticky;top:0;background:#fff;display:flex;gap:8px;padding:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:100;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;color:var(--orange)} .logo span{color:#000}
.search{flex:1;min-width:140px;padding:10px 14px;border-radius:22px;border:2px solid var(--orange);background:#fffef5}
select{padding:8px 10px;border-radius:20px;border:1px solid #ddd;font-size:12px}
.role-tabs{display:flex;gap:6px;padding:10px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;position:sticky;top:60px;z-index:90}
.role{padding:8px 16px;border-radius:20px;border:1px solid var(--orange);background:#fff;color:var(--orange);font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}
.role.active{background:var(--orange);color:#fff}
.hero{background:linear-gradient(135deg,#FF6A00,#ff2e78);color:#fff;text-align:center;padding:16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fff}
.fbtn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid #FF6A00;background:#fff;color:#FF6A00;font-size:12px;cursor:pointer}
.fbtn.active{background:#FF6A00;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #ffe0cc;position:relative}
.card.pub{border:2px solid var(--orange);box-shadow:0 4px 15px rgba(255,106,0,.3);background:#fffaf5}
.card img{width:100%;height:165px;object-fit:cover}
.badge-pub{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:900;z-index:2}
.badge-views{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;padding:3px 6px;border-radius:10px;font-size:9px}
.card-body{padding:8px}
.cat{font-size:9px;color:var(--orange);font-weight:800}
.title{font-size:12px;font-weight:700;height:32px;overflow:hidden;margin:3px 0}
.price{color:var(--orange);font-weight:900;font-size:14px}
.meta{font-size:10px;color:#888}
.share-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.share-row button{border:none;padding:4px 8px;border-radius:12px;font-size:10px;color:#fff;font-weight:700;cursor:pointer}
.wa{background:#25D366} .fb{background:#1877F2} .ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)} .copy{background:#333}
.fab{position:fixed;bottom:16px;right:16px;background:var(--orange);color:#fff;width:60px;height:60px;border-radius:50%;border:none;font-size:28px;box-shadow:0 4px 15px rgba(255,106,0,.4);z-index:99}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:12px}
.modal.active{display:flex}
.box{background:#fff;width:100%;max-width:430px;border-radius:16px;padding:16px;max-height:95vh;overflow:auto}
.box input,.box select{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ddd;font-size:13px}
.box button{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;margin-top:8px;cursor:pointer}
.btn-pub{background:var(--orange);color:#fff}
.social-preview{background:#fff8f0;border:2px dashed var(--orange);border-radius:12px;padding:12px;margin-top:12px}
.pub-check{background:#fff3e0;border:1px solid var(--orange);padding:10px;border-radius:10px;display:flex;gap:8px;align-items:center;margin:8px 0}
.camera-btn{background:#e3f2fd;border:1px solid #2196f3;color:#1976d2;padding:8px;border-radius:8px;width:100%;margin:6px 0;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><span>🌍 Our Cosmi ALIBABA V3 PUB - 195 Pays</span><span id="pubCount">0 PUB actifs</span></div>
<header><div class="logo">Our Cosmi<span>.com</span></div><input id="search" class="search" placeholder="Perruque, crème..."><select id="countryFilter"></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header>
<div class="role-tabs">
<button class="role active" data-role="buyer">🛒 Acheteur</button>
<button class="role" data-role="seller">🏪 Vendeur PUB</button>
<button class="role" data-role="livreur">🚚 Livreur</button>
</div>
<div class="hero"><h1 id="heroTitle">🔥 Produits PUB en haut comme Alibaba</h1><p id="heroSub">Vendeur coche PUB → produit sponsorisé auto + photo auto</p></div>
<div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button><button class="fbtn" data-cat="pub">🔥 PUB seulement</button></div>

<div id="buyerView"><div class="products" id="grid"></div></div>

<div id="sellerView" style="display:none;padding:12px">
<div class="box" style="max-width:100%"><h3>🏪 Vendeur - Publie en PUB Alibaba</h3>
<form id="form">
<input id="pName" placeholder="Nom produit ex: Perruque Brésilienne 22 pouces" required>
<div style="display:flex;gap:6px"><input id="pPrice" type="number" placeholder="Prix" required style="flex:1"><select id="pCurrency"><option>MRU</option><option>XOF</option><option>EUR €</option><option>USD $</option><option>AED</option><option>MAD</option></select></div>
<select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select>
<select id="pCountry" required></select>
<input id="pVendor" placeholder="Nom boutique ex: Fatou Beauty" required>
<input id="pWa" placeholder="WhatsApp +222..." required>
<input type="file" id="pFile" accept="image/*" capture="environment" style="display:none">
<button type="button" class="camera-btn" onclick="document.getElementById('pFile').click()">📸 Prendre photo / Choisir depuis téléphone (AUTO)</button>
<input id="pImg" placeholder="Ou colle lien photo (optionnel - auto si vide)">
<div class="pub-check"><input type="checkbox" id="pIsPub" style="width:20px;height:20px"><label for="pIsPub" style="font-size:12px;font-weight:800">🚀 <span style="color:var(--orange)">Mettre en PUBLICITÉ PUB</span> - Apparaît en haut + badge Sponsorisé + 3x plus de vues<br><small style="font-weight:400;color:#666">Alibaba style : +500 MRU pour booster (fictif pour test)</small></label></div>
<button type="submit" class="btn-pub">Publier & Générer PUB Auto 🚀</button>
</form>
<div id="socialResult" style="display:none"><div class="social-preview"><h4>✅ Publié en <span id="pubStatus"></span> !</h4><p id="previewText" style="white-space:pre-wrap"></p><img id="previewImg" style="width:100%;border-radius:8px;margin-top:6px;display:none"><div class="share-row" style="margin-top:10px"><button class="wa" id="shareWa">WhatsApp</button><button class="fb" id="shareFb">Facebook</button><button class="ig" id="shareIg">Instagram</button><button class="copy" id="shareCopy">Copier</button></div></div></div>
<div style="margin-top:14px"><h4>Tes produits</h4><div id="myProducts"></div></div>
</div>
</div>

<div id="livreurView" style="display:none;padding:12px">
<h3>🚚 Espace Livreur</h3>
<div style="display:flex;gap:8px;margin:10px 0"><input id="livName" placeholder="Nom livreur" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ddd"><select id="livZone"><option>Nouakchott</option><option>Dakar</option><option>Paris</option><option>Dubaï</option><option>Global</option></select><button id="addLiv" style="background:#4caf50;color:#fff;border:none;padding:8px 12px;border-radius:8px">S'inscrire</button></div>
<div id="livList"></div>
</div>

<button class="fab" id="fab">+</button>

<script>
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Côte d'Ivoire",flag:"🇨🇮",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"},{name:"Chine",flag:"🇨🇳",cont:"Asie"},{name:"Turquie",flag:"🇹🇷",cont:"Asie"},{name:"UK",flag:"🇬🇧",cont:"Europe"}];
const KEY="our_cosmi_alibaba_v3_pub"; const LIVKEY="our_cosmi_livreurs_v3";
const defaults=[
{name:"Perruque Brésilienne 22\" PUB",price:"4500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400",isPub:true,views:342},
{name:"Crème Teint Diamant",price:"45 EUR",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400",isPub:false,views:89},
{name:"Parfum Oud Dubaï PUB",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400",isPub:true,views:512}
];
let items=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
let livreurs=JSON.parse(localStorage.getItem(LIVKEY)||"[]");
let tempBase64Img=null;
const cf=document.getElementById("countryFilter"), pC=document.getElementById("pCountry");

function autoImage(name,cat,custom){
 if(tempBase64Img) return tempBase64Img;
 if(custom && custom.startsWith('http')) return custom;
 name=(name||"").toLowerCase(); cat=(cat||"").toLowerCase();
 if(cat.includes('perruque')||name.includes('perruque')||name.includes('wig')||name.includes('cheveux')) return "https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400";
 if(cat.includes('crème')||cat.includes('creme')||name.includes('crème')||name.includes('teint')) return "https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400";
 if(cat.includes('parfum')||name.includes('parfum')||name.includes('oud')||name.includes('parf')) return "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400";
 if(cat.includes('maquillage')||name.includes('makeup')||name.includes('rouge')) return "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400";
 return "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400";
}
function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join(''); cf.innerHTML=o; pC.innerHTML='<option value="">Ton pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}
let activeCat="all", activeRole="buyer";
const grid=document.getElementById("grid");
function genSocialText(p){return `${p.isPub?'🔥 PUB SPONSORISÉ - ':''}${p.name} - ${p.price} ${p.flag} ${p.country}\n🏪 ${p.vendor}\n👁️ Vu par ${p.views} personnes\n📲 WhatsApp: https://wa.me/${p.wa}\n🌍 https://abdousamed39-commits.github.io/our-cosmi/ #OurCosmi #PUB`;}

function render(){
 let filtered=items.filter(i=>{
  const mCat=activeCat==="all"||(activeCat==="pub"?i.isPub:i.cat===activeCat);
  const term=document.getElementById("search").value.toLowerCase();
  const mSearch=i.name.toLowerCase().includes(term);
  const cval=cf.value; const mCountry=cval==="all"||i.country===cval;
  const cont=document.getElementById("contFilter").value;
  const w=WORLD.find(x=>x.name===i.country);
  const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);
  return mCat&&mSearch&&mCountry&&mCont;
 });
 // PUB D'ABORD COMME ALIBABA
 filtered.sort((a,b)=>{ if(a.isPub && !b.isPub) return -1; if(!a.isPub && b.isPub) return 1; return b.views-a.views; });
 grid.innerHTML="";
 filtered.forEach(p=>{
  const d=document.createElement("div"); d.className="card"+(p.isPub?" pub":"");
  d.innerHTML=`${p.isPub?'<div class="badge-pub">🔥 PUB</div>':''}<div class="badge-views">👁️ ${p.views}</div><img src="${p.img}"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country} ${p.isPub?'• ⭐ Sponsorisé':''}</div><div class="title">${p.name}</div><div class="meta">${p.vendor} • ${p.isPub?'Boosté 🚀':'Standard'}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="price">${p.price}</div><button class="wa" style="border:none;padding:5px 10px;border-radius:10px;color:#fff;background:#25D366;font-size:10px;font-weight:800" onclick="window.open('https://wa.me/${p.wa}?text=${encodeURIComponent(genSocialText({name:'${p.name.replace(/'/g,"")}',price:'${p.price}',country:'${p.country}',flag:'${p.flag}',vendor:'${p.vendor}',wa:'${p.wa}',views:${p.views},isPub:${p.isPub}}))}','_blank')">WhatsApp</button></div><div class="share-row"><button class="fb" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=https://abdousamed39-commits.github.io/our-cosmi/&quote=${encodeURIComponent(genSocialText({name:'${p.name.replace(/'/g,"")}',price:'${p.price}',country:'${p.country}',flag:'${p.flag}',vendor:'${p.vendor}',wa:'${p.wa}',views:${p.views},isPub:${p.isPub}}))}','_blank')">FB</button><button class="ig" onclick="navigator.clipboard.writeText(\`${genSocialText(p).replace(/`/g,'')}\`);alert('Texte PUB copié ! Colle sur Insta')">IG PUB</button><button class="copy" style="background:${p.isPub?'#FF6A00':'#333'}" onclick="navigator.clipboard.writeText(\`${genSocialText(p).replace(/`/g,'')}\`);alert('${p.isPub?'PUB copié - il sera en haut':'Copié'}')">${p.isPub?'🔥 PUB':'Copy'}</button></div></div>`;
  grid.appendChild(d);
 });
 localStorage.setItem(KEY,JSON.stringify(items));
 document.getElementById("pubCount").innerText=`${items.filter(i=>i.isPub).length} PUB actifs`;
 renderMy();
}
function renderMy(){const c=document.getElementById("myProducts"); if(!c)return; c.innerHTML=items.slice(0,8).map(p=>`<div style="background:${p.isPub?'#fff3e0':'#fff'};border:${p.isPub?'2px solid #FF6A00':'1px solid #eee'};padding:8px;margin:6px 0;border-radius:10px;display:flex;gap:8px;align-items:center"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px"><div style="flex:1"><b style="font-size:12px">${p.isPub?'🔥':''} ${p.name}</b><br><small>${p.price} - 👁️ ${p.views} - ${p.isPub?'PUB 🚀':'Normal'}</small></div><button style="border:none;padding:6px 10px;border-radius:10px;color:#fff;background:${p.isPub?'#FF6A00':'#999'};font-size:10px" onclick="togglePub('${p.name.replace(/'/g,"")}')">${p.isPub?'Dépub':'PUB'}</button></div>`).join('');}
window.togglePub=(name)=>{const p=items.find(x=>x.name===name); if(p){p.isPub=!p.isPub; p.views+=p.isPub?100:0; render();}};

fill();
document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); activeCat=b.dataset.cat; render();}));
cf.addEventListener("change",render); document.getElementById("contFilter").addEventListener("change",render); document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".role").forEach(r=>r.addEventListener("click",()=>{document.querySelectorAll(".role").forEach(x=>x.classList.remove("active")); r.classList.add("active"); activeRole=r.dataset.role; document.getElementById("buyerView").style.display=activeRole==="buyer"?"block":"none"; document.getElementById("sellerView").style.display=activeRole==="seller"?"block":"none"; document.getElementById("livreurView").style.display=activeRole==="livreur"?"block":"none";}));

document.getElementById("fab").onclick=()=>{document.querySelector('[data-role="seller"]').click(); window.scrollTo(0,0);};

document.getElementById("pFile").addEventListener("change",e=>{
 const file=e.target.files[0]; if(!file) return;
 const reader=new FileReader(); reader.onload=ev=>{tempBase64Img=ev.target.result; alert("✅ Photo capturée ! Elle sera utilisée auto"); document.getElementById("pImg").placeholder="✅ Photo téléphone prête (auto)";}; reader.readAsDataURL(file);
});

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const cName=pC.value; const obj=WORLD.find(x=>x.name===cName)||{flag:"🌍"};
 const np={
  name:document.getElementById("pName").value,
  price:document.getElementById("pPrice").value+" "+document.getElementById("pCurrency").value,
  country:cName, flag:obj.flag, cat:document.getElementById("pCat").value,
  vendor:document.getElementById("pVendor").value,
  wa:document.getElementById("pWa").value.replace(/\s|\+/g,''),
  img:autoImage(document.getElementById("pName").value, document.getElementById("pCat").value, document.getElementById("pImg").value),
  isPub:document.getElementById("pIsPub").checked,
  views:document.getElementById("pIsPub").checked? Math.floor(Math.random()*300)+200 : Math.floor(Math.random()*80)+5
 };
 items.unshift(np);
 render();
 document.getElementById("socialResult").style.display="block";
 document.getElementById("pubStatus").innerText=np.isPub?"PUB SPONSORISÉ 🚀 (en haut)":"STANDARD";
 document.getElementById("pubStatus").style.color=np.isPub?"#FF6A00":"#666";
 document.getElementById("previewText").innerText=genSocialText(np);
 const img=document.getElementById("previewImg"); img.src=np.img; img.style.display="block";
 document.getElementById("shareWa").onclick=()=>window.open(`https://wa.me/?text=${encodeURIComponent(genSocialText(np))}`,'_blank');
 document.getElementById("shareFb").onclick=()=>window.open(`https://www.facebook.com/sharer/sharer.php?u=https://abdousamed39-commits.github.io/our-cosmi/&quote=${encodeURIComponent(genSocialText(np))}`,'_blank');
 document.getElementById("shareIg").onclick=()=>{navigator.clipboard.writeText(genSocialText(np)); alert("Texte PUB copié ! Ouvre Instagram et colle"); window.open('https://www.instagram.com/','_blank');};
 document.getElementById("shareCopy").onclick=()=>{navigator.clipboard.writeText(genSocialText(np)); alert("Copié !");};
 tempBase64Img=null; e.target.reset();
});

function renderLiv(){document.getElementById("livList").innerHTML=livreurs.map(l=>`<div style="background:#e8f5e9;border-left:4px solid #4caf50;padding:10px;margin:8px 0;border-radius:8px">🚚 ${l.name} - ${l.zone} ✅</div>`).join('')||"Aucun livreur"; localStorage.setItem(LIVKEY,JSON.stringify(livreurs));}
document.getElementById("addLiv").onclick=()=>{const n=document.getElementById("livName").value; const z=document.getElementById("livZone").value; if(!n)return alert("Nom"); livreurs.unshift({name:n,zone:z}); document.getElementById("livName").value=""; renderLiv();};

render(); renderLiv();
</script>
</body>
  </html>
